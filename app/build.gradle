plugins { id 'com.android.application' }
android {
    namespace 'in.dop.tr25'
    compileSdk 34
    defaultConfig {
        applicationId "in.dop.tr25"
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName "3.5"
    }
    signingConfigs {
        // fixed key so every new build installs over the old one without losing data
        fixed { storeFile file('tr25.keystore'); storePassword 'tr25bill'; keyAlias 'tr25'; keyPassword 'tr25bill' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
