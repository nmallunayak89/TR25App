name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Test calculations
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee test.log || {
            grep -E '^e: |FAILED|Exception|expected|What went wrong' -A1 test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -h -A2 '<failure' "$f" | head -6 | while IFS= read -r l; do echo "::error::$l"; done; done
            exit 1; }
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E '^e: |error:|What went wrong' -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: TR25-Bill-Generator-APK, path: app/build/outputs/apk/debug/app-debug.apk }
